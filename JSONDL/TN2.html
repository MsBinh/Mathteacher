<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>AI TOÁN THẦY BÌNH - PHIÊN BẢN 2.0</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #0f172a; --gold: #f59e0b; }
        body { font-family: 'Segoe UI', sans-serif; background: #e2e8f0; margin: 0; padding: 20px; }
        #chat-box { max-width: 800px; margin: 0 auto; background: white; border-radius: 15px; height: 85vh; display: flex; flex-direction: column; box-shadow: 0 10px 25px rgba(0,0,0,0.2); border: 2px solid var(--primary); }
        #messages { flex: 1; overflow-y: auto; padding: 20px; background: #f8fafc; }
        .msg { margin-bottom: 15px; padding: 12px; border-radius: 10px; max-width: 85%; line-height: 1.5; }
        .user { background: var(--gold); align-self: flex-end; margin-left: auto; font-weight: 500; }
        .bot { background: #f1f5f9; border: 1px solid #cbd5e1; }
        #input-area { padding: 15px; border-top: 2px solid #e2e8f0; display: flex; gap: 10px; background: white; border-radius: 0 0 15px 15px; }
        input { flex: 1; padding: 12px; border: 1px solid #cbd5e1; border-radius: 25px; outline: none; }
        img { max-width: 100%; border-radius: 5px; margin-top: 5px; }
        #preview { display: none; padding: 10px; background: #fffbeb; border-top: 1px solid #fde68a; text-align: center; }
    </style>
</head>
<body>

<div id="chat-box">
    <div style="background: var(--primary); color: white; padding: 15px; border-radius: 13px 13px 0 0; text-align: center;">
        <h3 style="margin:0">TRỢ LÝ TOÁN THỰC CHIẾN - THS. NGUYỄN THANH BÌNH</h3>
    </div>
    <div id="messages"></div>
    <div id="preview"><img id="p-img" style="height: 60px;"> <small>(Nhấn Enter để gửi ảnh đã dán)</small></div>
    <div id="input-area">
        <input type="text" id="in" placeholder="Dán ảnh (Ctrl+V) hoặc nhập câu hỏi tại đây...">
        <button onclick="send()" style="background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer;">GỬI</button>
    </div>
</div>

<script>
    const KEY = "AIzaSyDj6JH3aIb-wUmyuosxgZ4VL7DESXTRuPo";
    let imgB64 = null;

    // XỬ LÝ DÁN ẢNH (CTRL+V)
    window.addEventListener('paste', e => {
        const item = e.clipboardData.items[0];
        if (item.type.indexOf("image") !== -1) {
            const reader = new FileReader();
            reader.onload = event => {
                imgB64 = event.target.result.split(',')[1];
                document.getElementById('p-img').src = event.target.result;
                document.getElementById('preview').style.display = 'block';
            };
            reader.readAsDataURL(item.getAsFile());
        }
    });

    async function send() {
        const txt = document.getElementById('in').value;
        if (!txt && !imgB64) return;

        addMsg(txt, imgB64, 'user');
        document.getElementById('in').value = '';
        document.getElementById('preview').style.display = 'none';
        
        const loadId = addMsg("Thầy đang tính...", null, 'bot');

        try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${KEY}`, {
                method: 'POST',
                body: JSON.stringify({
                    contents: [{ parts: [
                        { text: `Bạn là Thạc sĩ Nguyễn Thanh Bình. Giải toán 3 bước: Chiến thuật, Lời giải (LaTeX $...$), Lời dặn. Bài toán: ${txt}` },
                        ...(imgB64 ? [{ inline_data: { mime_type: "image/jpeg", data: imgB64 } }] : [])
                    ]}]
                })
            });
            const data = await res.json();
            const reply = data.candidates[0].content.parts[0].text;
            document.getElementById(loadId).innerHTML = `<b>Thầy Bình:</b><br>${reply.replace(/\n/g, '<br>')}`;
            imgB64 = null;
            MathJax.typeset();
        } catch (e) { console.error(e); }
    }

    function addMsg(t, img, cls) {
        const id = 'm-' + Date.now();
        const div = document.createElement('div');
        div.id = id; div.className = `msg ${cls}`;
        div.innerHTML = (t ? `<div>${t}</div>` : '') + (img ? `<img src="data:image/jpeg;base64,${img}">` : '');
        document.getElementById('messages').appendChild(div);
        return id;
    }

    document.getElementById('in').addEventListener('keypress', e => { if(e.key==='Enter') send(); });
</script>
</body>
</html>
