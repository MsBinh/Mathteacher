<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>PHÒNG THI TRỰC TUYẾN - MATH HUB V2</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --primary: #1a237e; --accent: #f59e0b; --success: #10b981; --danger: #ef4444;
            --bg: #f3f4f6; --card-bg: #ffffff; --border: #e5e7eb;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .navbar {
            background: white; height: 65px; display: flex; justify-content: space-between;
            align-items: center; padding: 0 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); z-index: 100;
            border-bottom: 3px solid var(--primary);
        }
        .brand { font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 8px; }
        .timer-badge {
            background: var(--accent); color: white; padding: 8px 20px; border-radius: 20px;
            font-size: 1.2rem; font-weight: 900; display: flex; align-items: center; gap: 8px;
        }

        .main-container { display: flex; flex: 1; overflow: hidden; }
        .pdf-section { flex: 1; background: #525659; border-right: 2px solid var(--border); position: relative; }
        .answer-section { width: 450px; background: white; display: flex; flex-direction: column; }

        .sheet-header { padding: 15px; border-bottom: 1px solid var(--border); text-align: center; }
        .exam-title { font-weight: 800; color: var(--primary); text-transform: uppercase; }
        .scroll-area { flex: 1; overflow-y: auto; padding: 20px; }
        
        .part-header { 
            background: var(--primary); color: white; padding: 10px; 
            border-radius: 5px; font-weight: bold; margin: 20px 0 10px 0; font-size: 0.9rem;
        }

        .q-card { background: #f8fafc; border-radius: 10px; padding: 15px; margin-bottom: 15px; border: 1px solid var(--border); transition: all 0.2s; }
        .q-card.active { border: 2px solid var(--accent) !important; background: #fffbeb; }
        
        .bubble-grid { display: flex; justify-content: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
        .bubble { 
            width: 40px; height: 40px; border-radius: 50%; border: 2px solid #cbd5e1;
            background: white; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .bubble.selected { background: var(--primary); color: white; border-color: var(--primary); }

        .tf-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; background: white; padding: 8px; border-radius: 8px; flex-wrap: wrap; gap: 8px; }
        .tf-btn { padding: 5px 12px; border-radius: 5px; border: 1px solid #ccc; background: white; cursor: pointer; font-size: 0.8rem; font-weight: bold; }
        .tf-btn.t-active { background: var(--success); color: white; border-color: var(--success); }
        .tf-btn.f-active { background: var(--danger); color: white; border-color: var(--danger); }
        .sa-input { width: 100%; padding: 12px; border: 2px solid var(--border); border-radius: 8px; text-align: center; font-weight: bold; font-size: 1.1rem; outline: none; }

        .btn-submit { 
            width: 100%; padding: 15px; background: var(--primary); color: white;
            border: none; font-weight: 800; cursor: pointer; font-size: 1.1rem;
        }

        .overlay { 
            position: fixed; inset: 0; background: white; z-index: 9999; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
        }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* ĐÃ CẢI TIẾN: Thanh điều hướng điện thoại nhỏ gọn chứa 3 nút */
        #mobileNav {
            position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%);
            display: none; gap: 8px; z-index: 999;
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(10px);
            padding: 10px 15px; border-radius: 40px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            white-space: nowrap;
        }
        #mobileNav button { 
            padding: 8px 14px; border-radius: 30px; border: none; 
            background: rgba(255,255,255,0.2); color: white; 
            font-weight: bold; font-size: 0.85rem; cursor: pointer; transition: 0.2s;
        }
        #mobileNav button.btn-submit-mobile {
            background: var(--accent); color: var(--primary); font-weight: 900;
        }

        @media (max-width: 860px) {
            .main-container { flex-direction: column; }
            .pdf-section { width: 100%; height: 55vh; flex: none; border-right: none; border-bottom: 3px solid var(--primary); }
            .answer-section { width: 100%; height: 45vh; flex: none; }
            .bubble { width: 38px; height: 38px; }
            .timer-badge { padding: 6px 12px; font-size: 1rem; }
            .brand { font-size: 1rem; }
            #studentInfo { display: none; }
            /* Thêm khoảng trống cuối danh sách để nút không che mất câu cuối */
            .scroll-area { padding-bottom: 80px; } 
        }
    </style>
</head>
<body>

<div class="overlay" id="loader">
    <div class="spinner"></div>
    <p style="margin-top: 15px; font-weight: bold; color: var(--primary);">Đang nạp đề thi...</p>
</div>

<nav class="navbar">
    <div class="brand">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3L1 9L12 15L21 10.09V17H23V9M5 13.18V17.18L12 21L19 17.18V13.18L12 17L5 13.18Z"/></svg>
        MATH HUB V2
    </div>
    <div id="studentInfo" style="font-size: 0.85rem; font-weight: 600; color: #666;"></div>
    <div class="timer-badge">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12,20A8,8 0 0,0 20,12A8,8 0 0,0 12,4A8,8 0 0,0 4,12A8,8 0 0,0 12,20M12,2A10,10 0 0,1 22,12A10,10 0 0,1 12,22C6.47,22 2,17.5 2,12A10,10 0 0,1 12,2M12.5,7V12.25L17,14.92L16.25,16.15L11,13V7H12.5Z"/></svg>
        <span id="timer">--:--</span>
    </div>
</nav>

<div class="main-container">
    <div class="pdf-section">
        <iframe id="pdfView" src="" style="width:100%; height:100%; border:none;"></iframe>
    </div>
    <div class="answer-section">
        <div class="sheet-header">
            <div class="exam-title" id="examName">ĐANG TẢI...</div>
        </div>
        <div class="scroll-area" id="sheetArea"></div>
        <button class="btn-submit" onclick="submitTest()">NỘP BÀI THI</button>
    </div>
</div>

<!-- ĐÃ CẢI TIẾN: Thêm nút NỘP BÀI vào thanh Mobile -->
<div id="mobileNav">
    <button onclick="scrollToPDF()">📄 Đề thi</button>
    <button onclick="scrollToSheet()">📝 Làm bài</button>
    <button class="btn-submit-mobile" onclick="submitTest()">🚀 NỘP BÀI</button>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCs0lTFawsn0ibf_BsZcoAr8sdQJD68brA",
        authDomain: "mathhub-v2-2026.firebaseapp.com",
        databaseURL: "https://mathhub-v2-2026-default-rtdb.firebaseio.com",
        projectId: "mathhub-v2-2026",
        storageBucket: "mathhub-v2-2026.firebasestorage.app",
        messagingSenderId: "1354411258",
        appId: "1:1354411258:web:406775fcadcc319f82ad43"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const params = new URLSearchParams(window.location.search);
    const isDemo = params.get('demo') === 'true';
    const tid = params.get('t') || 'ADMIN';
    const eid = params.get('exam');
    const sCode = params.get('code') || 'KHACH';
    const sName = params.get('name') || 'Người dùng trải nghiệm';

    let masterKey = [];
    let userAnswers = {};
    let time = 0;
    let examSubject = "Toán";
    let examStructure = null;
    let examSolutionLink = ""; 

    function normalizeAnswer(str) {
        if (!str) return '';
        return String(str).trim().toLowerCase().replace(/,/g, '.').replace(/\s+/g, '');
    }

    function calculateScorePro(masterKey, userAnswers, structure) {
        if (!masterKey || masterKey.length === 0) return 0;
        if (!structure) {
            console.warn("Không có structure, dùng cấu hình mặc định");
            structure = { mcq: { count: 12, score: 0.25 }, tf: { count: 4, scoreMap: [0, 0.1, 0.25, 0.5, 1.0] }, sa: { count: 6, score: 0.5 } };
        }
        
        let totalScore = 0;
        const mcqScores = [];
        const tfScores = [];
        const saScores = [];
        
        masterKey.forEach(q => {
            const ans = userAnswers[q.id];
            const type = q.type;
            
            if (type === 'multiple_choice') {
                let score = 0;
                if (ans && ans === q.correct) {
                    score = structure.mcq?.score || 0.25;
                }
                mcqScores.push(score);
                totalScore += score;
            }
            else if (type === 'true_false') {
                let correctCount = 0;
                if (ans && typeof ans === 'object') {
                    const correctMap = q.correct || { a: false, b: false, c: false, d: false };
                    ['a', 'b', 'c', 'd'].forEach(letter => {
                        const userVal = ans[letter] === true;
                        const correctVal = correctMap[letter] === true;
                        if (userVal === correctVal) correctCount++;
                    });
                }
                const scoreMap = structure.tf?.scoreMap || [0, 0.1, 0.25, 0.5, 1.0];
                const score = scoreMap[correctCount] || 0;
                tfScores.push(score);
                totalScore += score;
            }
            else if (type === 'short_answer') {
                let score = 0;
                if (ans) {
                    const normUser = normalizeAnswer(ans);
                    const normCorrect = normalizeAnswer(q.correct);
                    if (normUser === normCorrect) {
                        score = structure.sa?.score || 0.5;
                    }
                }
                saScores.push(score);
                totalScore += score;
            }
        });
        
        return parseFloat(totalScore.toFixed(2));
    }

    async function saveAttemptToFirebase(data) {
        try {
            const newRef = db.ref('system_stats/attempts').push();
            await newRef.set({
                ...data,
                teacherId: tid,
                timestamp: Date.now()
            });
            await db.ref(`teachers/${tid}/attempts/${newRef.key}`).set(data);
            
            const dateKey = new Date().toISOString().slice(0, 10);
            await db.ref(`system_stats/daily/${dateKey}/totalAttempts`).set(firebase.database.ServerValue.increment(1));
            await db.ref(`system_stats/daily/${dateKey}/bySubject/${data.subject || "Toán"}`).set(firebase.database.ServerValue.increment(1));
            
            return true;
        } catch (e) {
            console.error("Lỗi ghi Firebase:", e);
            return false;
        }
    }

    function loadPDFOptimized(pdfLink) {
        const iframe = document.getElementById('pdfView');
        if (window.innerWidth < 768 && pdfLink) {
            iframe.src = pdfLink + (pdfLink.includes('?') ? '&zoom=page-width' : '#zoom=page-width');
        } else {
            iframe.src = pdfLink;
        }
    }

    function scrollToPDF() {
        document.querySelector('.pdf-section').scrollIntoView({ behavior: 'smooth' });
    }
    function scrollToSheet() {
        document.querySelector('.answer-section').scrollIntoView({ behavior: 'smooth' });
    }

    async function init() {
        if(!eid) return alert("Lỗi: Không tìm thấy mã đề thi trong link!");
        document.getElementById('studentInfo').innerText = `${sCode} - ${sName}`;
        
        if(window.innerWidth < 860){
            document.getElementById('mobileNav').style.display = 'flex';
        }
        
        try {
            let examPath = isDemo ? `demo_exams/${eid}` : `teachers/${tid}/exams/${eid}`;
            let keyPath = isDemo ? `demo_master_keys/${eid}` : `teachers/${tid}/exam_master_keys/${eid}`;

            const examSnap = await db.ref(examPath).once('value');
            const examData = examSnap.val();
            
            if(!examData) {
                alert("Đề thi không tồn tại hoặc đã bị xóa!");
                window.location.href = 'index.html';
                return;
            }

            const keySnap = await db.ref(keyPath).once('value');
            masterKey = keySnap.val() || [];
            
            examStructure = examData.structure || null;
            examSubject = examData.subject || "Toán";
            
            examSolutionLink = examData.solutionLink || "";

            console.log("Cấu trúc đề thi:", examStructure);
            console.log("Môn học:", examSubject);

            let pdfLink = examData.pdfUrl || examData.pdfLink;
            if (pdfLink && pdfLink.includes('drive.google.com')) {
                pdfLink = pdfLink.replace('/view', '/preview');
            } else if (pdfLink && pdfLink.includes('github.com')) {
                pdfLink = pdfLink.replace('github.com', 'raw.githubusercontent.com').replace('/blob/', '/');
            }
            
            loadPDFOptimized(pdfLink || '');
            document.getElementById('examName').innerHTML = `${examData.name || 'Đề thi'} <span style="font-size:0.7rem;">(${examSubject})</span>`;
            
            renderSheet();
            startTimer(examData.duration || 90);
            
            setTimeout(() => {
                document.getElementById('loader').style.display = 'none';
            }, 500);

        } catch (e) { 
            console.error(e);
            alert("Lỗi kết nối Firebase! Vui lòng kiểm tra lại mạng.");
        }
    }

    function renderSheet() {
        const area = document.getElementById('sheetArea');
        let html = '';
        
        if (!masterKey || masterKey.length === 0) {
            area.innerHTML = '<div style="text-align:center; padding:40px;">Không có dữ liệu câu hỏi</div>';
            return;
        }
        
        let mcqCount = examStructure?.mcq?.count || 12;
        let tfCount = examStructure?.tf?.count || 4;
        let saCount = examStructure?.sa?.count || 6;
        
        let parts = { p1: false, p2: false, p3: false };
        let currentIdx = 0;
        
        masterKey.forEach((q, idx) => {
            const qId = q.id || idx + 1;
            const type = q.type;
            
            if (type === 'multiple_choice') {
                if (!parts.p1 && (currentIdx < mcqCount || mcqCount > 0)) { 
                    const mcqScore = examStructure?.mcq?.score || 0.25;
                    html += `<div class="part-header">📌 PHẦN I. TRẮC NGHIỆM (${mcqScore}đ/câu)</div>`; 
                    parts.p1 = true; 
                }
                html += `<div class="q-card" data-id="${qId}">
                            <b>Câu ${qId}:</b>
                            <div class="bubble-grid">
                                ${['A','B','C','D'].map(v => `<button class="bubble" id="q_${qId}_${v}" onclick="pickMCQ(${qId},'${v}')">${v}</button>`).join('')}
                            </div>
                         </div>`;
                currentIdx++;
            } 
            else if (type === 'true_false') {
                if (!parts.p2) { 
                    html += `<div class="part-header">✅ PHẦN II. ĐÚNG/SAI (Thang điểm 0.1 - 1.0)</div>`; 
                    parts.p2 = true; 
                }
                html += `<div class="q-card" data-id="${qId}">
                            <b>Câu ${qId}:</b>
                            <div style="margin-top:10px;">
                                ${['a','b','c','d'].map(l => `
                                    <div class="tf-row">
                                        <span style="font-weight:800; width:30px;">${l})</span>
                                        <div class="tf-btns">
                                            <button class="tf-btn" id="tf_${qId}_${l}_t" onclick="pickTF(${qId},'${l}',true)">Đúng</button>
                                            <button class="tf-btn" id="tf_${qId}_${l}_f" onclick="pickTF(${qId},'${l}',false)">Sai</button>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                         </div>`;
                currentIdx++;
            } 
            else if (type === 'short_answer') {
                if (!parts.p3) { 
                    const saScore = examStructure?.sa?.score || 0.5;
                    html += `<div class="part-header">✏️ PHẦN III. TRẢ LỜI NGẮN (${saScore}đ/câu)</div>`; 
                    parts.p3 = true; 
                }
                html += `<div class="q-card" data-id="${qId}">
                            <b>Câu ${qId}:</b>
                            <div style="margin-top:10px;">
                                <input type="text" class="sa-input" id="sa_${qId}" placeholder="Nhập đáp số..." onchange="pickSA(${qId}, this.value)">
                            </div>
                         </div>`;
                currentIdx++;
            }
        });
        area.innerHTML = html;
    }

    window.pickMCQ = (id, val) => {
        userAnswers[id] = val;
        
        document.querySelectorAll('.q-card').forEach(el => el.classList.remove('active'));
        const currentCard = document.querySelector(`.q-card[data-id="${id}"]`);
        if(currentCard) currentCard.classList.add('active');
        
        ['A','B','C','D'].forEach(v => {
            const btn = document.getElementById(`q_${id}_${v}`);
            if(btn) btn.classList.toggle('selected', v === val);
        });
        
        setTimeout(() => {
            const nextCard = document.querySelector(`.q-card[data-id="${id + 1}"]`);
            if(nextCard) {
                nextCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                nextCard.classList.add('active');
            }
        }, 150);
    };

    window.pickTF = (id, letter, val) => {
        if(!userAnswers[id]) userAnswers[id] = {};
        userAnswers[id][letter] = val;
        const btnT = document.getElementById(`tf_${id}_${letter}_t`);
        const btnF = document.getElementById(`tf_${id}_${letter}_f`);
        if(btnT) btnT.classList.toggle('t-active', val === true);
        if(btnF) btnF.classList.toggle('f-active', val === false);
        
        document.querySelectorAll('.q-card').forEach(el => el.classList.remove('active'));
        const currentCard = document.querySelector(`.q-card[data-id="${id}"]`);
        if(currentCard) currentCard.classList.add('active');
    };

    window.pickSA = (id, val) => { 
        userAnswers[id] = val;
        document.querySelectorAll('.q-card').forEach(el => el.classList.remove('active'));
        const currentCard = document.querySelector(`.q-card[data-id="${id}"]`);
        if(currentCard) currentCard.classList.add('active');
    };

    function startTimer(m) {
        time = m * 60;
        const timerTask = setInterval(() => {
            if(time <= 0) {
                clearInterval(timerTask);
                submitTest(true);
                return;
            }
            time--;
            let mins = Math.floor(time/60);
            let secs = time%60;
            document.getElementById('timer').innerText = `${mins}:${secs < 10 ? '0'+secs : secs}`;
        }, 1000);
    }

    async function submitTest(isAuto = false) {
        if(!isAuto && !confirm("Bạn có chắc chắn muốn nộp bài ngay bây giờ?")) return;
        
        const finalScore = calculateScorePro(masterKey, userAnswers, examStructure);
        
        console.log("Điểm tính được:", finalScore, "| Structure:", examStructure);
        
        const attemptData = {
            examId: eid,
            studentCode: sCode,
            studentName: sName,
            score: finalScore,
            subject: examSubject,
            structure: examStructure, 
            timestamp: Date.now(),
            teacherId: tid,
            isDemo: isDemo,
            answers: userAnswers
        };
        
        const resultForKQ = {
            tid, eid, sCode, sName, isDemo,
            answers: userAnswers,
            score: finalScore,
            subject: examSubject,
            structure: examStructure,
            solutionLink: examSolutionLink, // Link giải nằm ở đây
            submittedAt: Date.now()
        };
        localStorage.setItem('lastResult', JSON.stringify(resultForKQ));
        
        const success = await saveAttemptToFirebase(attemptData);
        if (!success) {
            console.warn("Ghi dữ liệu thất bại, nhưng vẫn chuyển sang trang kết quả");
        }
        
        window.location.href = 'KQ.html';
    }

    window.scrollToPDF = scrollToPDF;
    window.scrollToSheet = scrollToSheet;
    window.onload = init;
    
    window.addEventListener('resize', function() {
        const pdfLink = document.getElementById('pdfView').src.split('#')[0].split('?')[0];
        if(pdfLink && pdfLink !== '') {
            loadPDFOptimized(pdfLink);
        }
        if(window.innerWidth < 860){
            document.getElementById('mobileNav').style.display = 'flex';
        } else {
            document.getElementById('mobileNav').style.display = 'none';
        }
    });
</script>
</body>
</html>
